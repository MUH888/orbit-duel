<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>The Runner — Escape the Shadow</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#050b14;color:white;font-family:system-ui,Arial;overflow-x:hidden}body{display:flex;justify-content:center;min-height:100vh}
#app{width:min(100vw,480px);min-height:100vh;background:#07111d;position:relative}.screen{padding:14px}.card{background:#0b1a2b;border:1px solid #29435f;border-radius:20px;padding:14px}
h1{font-size:34px;line-height:.95;margin:12px 0 8px;text-align:center}p{text-align:center;color:#c3d0df}.btn{width:100%;min-height:52px;border:0;border-radius:14px;background:#1687e8;color:#fff;font-size:18px;font-weight:900;margin-top:9px}.green{background:#17b965}
#game{padding:8px}.hud{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;font-weight:900;padding:6px 3px}.hud div:nth-child(2){text-align:center}.hud div:nth-child(3){text-align:right}
canvas{display:block;width:100%;height:auto;border-radius:16px;background:#111;touch-action:none;border:1px solid #29435f}
.msg{text-align:center;min-height:25px;font-weight:900;margin-top:6px}.small{text-align:center;color:#aebed1;font-size:12px;margin-top:7px}.hidden{display:none!important}
.worlds{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:10px}.world{padding:8px 2px;border-radius:10px;text-align:center;background:#152a42;font-size:11px}.world.on{outline:2px solid #4ad7ff}
</style></head>
<body><div id="app">
<section id="menu" class="screen"><div class="card">
<h1>THE RUNNER</h1><p><b>ESCAPE THE SHADOW</b><br>Run • Explore • Survive</p>
<div style="height:250px;border-radius:16px;overflow:hidden;position:relative;background:linear-gradient(#55b8f5 0 52%,#526a70 52%)">
<div style="position:absolute;bottom:0;left:22%;width:56%;height:65%;background:#303b45;clip-path:polygon(35% 0,65% 0,100% 100%,0 100%)"></div>
<div style="position:absolute;left:50%;bottom:38px;transform:translateX(-50%);font-size:66px">🏃🏻</div>
<div style="position:absolute;left:50%;bottom:4px;transform:translateX(-50%);font-size:54px;filter:brightness(.18)">👤</div>
<div style="position:absolute;top:15px;width:100%;text-align:center;font-weight:1000">CITY → TUNNEL → NEW WORLD</div></div>
<div style="text-align:center;font-weight:900;margin-top:10px">SPEED</div>
<div id="speedPick" style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:7px">
<button class="btn spd green" data-spd="1" style="font-size:13px;padding:6px">1<br><small>🦥 Bilkul Slow</small></button>
<button class="btn spd" data-spd="2" style="font-size:13px;padding:6px">2<br><small>Thora Tez</small></button>
<button class="btn spd" data-spd="3" style="font-size:13px;padding:6px">3<br><small>Tez</small></button>
<button class="btn spd" data-spd="4" style="font-size:13px;padding:6px">4<br><small>Super Tez</small></button>
</div>
<button id="play" class="btn green">▶ PLAY</button>
<div class="worlds"><div class="world on">🌆<br>City</div><div class="world">🌳<br>Jungle</div><div class="world">🏜️<br>Desert</div><div class="world">❄️<br>Snow</div><div class="world">🌌<br>Space</div></div>
</div></section>
<section id="game" class="hidden">
<div class="hud"><div id="dist">0 m</div><div id="coins">🪙 0</div><div id="world">CITY</div></div>
<canvas id="c" width="360" height="620"></canvas>
<div id="msg" class="msg"></div><button id="menuBtn" class="btn">Menu</button>
<div class="small">Screen par tap = JUMP • Left/right swipe = lane change</div>
</section>
<section id="over" class="screen hidden"><div class="card"><h1>GAME OVER</h1><p id="result"></p><button id="retry" class="btn green">RUN AGAIN</button><button id="overMenu" class="btn">MENU</button></div></section>
</div>
<script>
(()=>{
const $=s=>document.querySelector(s),menu=$('#menu'),game=$('#game'),over=$('#over'),c=$('#c'),x=c.getContext('2d');
const W=c.width,H=c.height;let run=false,raf=0,last=0,distance=0,coinCount=0,speed=6,lane=1,jump=0,jumpV=0,shadowGap=115,objects=[],spawn=0,world=0,tunnel=0,nextWorld=650,speedChoice=1;
const worlds=[{name:'CITY',sky:['#54b9f5','#d8f1ff'],road:'#39434c',side:'#6b7a7d',accent:'#2d8dbe'},
{name:'JUNGLE',sky:['#27784c','#9bd66c'],road:'#6c6652',side:'#164f2b',accent:'#54b948'},
{name:'DESERT',sky:['#5ec7f0','#ffd480'],road:'#a77a4d',side:'#e0ae62',accent:'#d98735'},
{name:'SNOW',sky:['#86c9f4','#e8f6ff'],road:'#a8c4d6',side:'#e8f5ff',accent:'#58a5d4'},
{name:'SPACE',sky:['#180b48','#5b24a0'],road:'#25225d',side:'#0c0927',accent:'#a843ff'}];
function show(s){[menu,game,over].forEach(q=>q.classList.add('hidden'));s.classList.remove('hidden')}
function reset(){run=true;last=0;distance=0;coinCount=0;speed=[0,1.5,6.5,9,12][speedChoice];lane=1;jump=0;jumpV=0;shadowGap=115;objects=[];spawn=0;world=0;tunnel=0;nextWorld=650;show(game);hud();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function hud(){$('#dist').textContent=Math.floor(distance)+' m';$('#coins').textContent='🪙 '+coinCount;$('#world').textContent=worlds[world].name}
function roadX(y,l){const t=y/H,center=W/2,half=25+t*150;return center+(l-1)*half*.55}
function projectY(z){return H-(z/700)*H}
function addObject(){const r=Math.random(),l=Math.floor(Math.random()*3);if(r<.55)objects.push({type:'coin',lane:l,z:700});else objects.push({type:'obs',lane:l,z:700,kind:Math.floor(Math.random()*3)})}
function drawWorld(){let w=worlds[world],g=x.createLinearGradient(0,0,0,H*.62);g.addColorStop(0,w.sky[0]);g.addColorStop(1,w.sky[1]);x.fillStyle=g;x.fillRect(0,0,W,H);
if(world===0){for(let i=0;i<8;i++){x.fillStyle=i%2?'#334b63':'#263d55';let bw=35+(i%3)*12,bh=100+(i%4)*35,bx=(i<4?i*45:W-((i-3)*45));x.fillRect(bx,H*.25-bh/2,bw,bh)}}
if(world===1){x.fillStyle='#0b4827';for(let i=0;i<10;i++){let bx=i*42-20;x.fillRect(bx,H*.2,15,H*.35);x.beginPath();x.arc(bx+8,H*.18,35,0,Math.PI*2);x.fill()}}
if(world===2){x.fillStyle='#c98d45';x.beginPath();x.moveTo(0,H*.45);x.quadraticCurveTo(70,H*.25,150,H*.45);x.quadraticCurveTo(250,H*.28,W,H*.44);x.lineTo(W,H*.6);x.lineTo(0,H*.6);x.fill()}
if(world===3){x.fillStyle='#dff4ff';for(let i=0;i<7;i++){let bx=i*60;x.beginPath();x.moveTo(bx,H*.42);x.lineTo(bx+35,H*.18);x.lineTo(bx+70,H*.42);x.fill()}}
if(world===4){x.fillStyle='#fff';for(let i=0;i<45;i++)x.fillRect((i*83)%W,(i*47)%300,2,2)}
x.fillStyle=w.side;x.fillRect(0,H*.48,W,H*.52);x.fillStyle=w.road;x.beginPath();x.moveTo(W*.43,H*.35);x.lineTo(W*.57,H*.35);x.lineTo(W,H);x.lineTo(0,H);x.closePath();x.fill();
x.strokeStyle='#ffffff88';x.lineWidth=2;for(let l=0;l<2;l++){x.beginPath();x.moveTo(W/2+(l?1:-1)*12,H*.35);x.lineTo(W/2+(l?1:-1)*100,H);x.stroke()}
}
function drawTunnel(){if(tunnel<=0)return;let a=Math.min(1,tunnel/90);x.fillStyle='rgba(0,0,0,'+(0.82*a)+')';x.fillRect(0,0,W,H);x.strokeStyle='#b66d28';x.lineWidth=18;x.beginPath();x.arc(W/2,H*.52,W*.43,Math.PI,Math.PI*2);x.stroke();x.fillStyle='#ffd27a';x.font='bold 20px system-ui';x.textAlign='center';x.fillText('ENTER THE TUNNEL',W/2,70)}
function runner(){let px=roadX(H*.82,lane),py=H*.80-jump;x.save();x.translate(px,py);x.font='54px system-ui';x.textAlign='center';x.textBaseline='middle';x.fillText('🏃🏻',0,0);x.restore();return {x:px,y:py}}
function shadow(r){let sy=Math.min(H-35,r.y+shadowGap);x.save();x.globalAlpha=.78;x.font='62px system-ui';x.textAlign='center';x.fillStyle='#000';x.fillText('👤',r.x,sy);x.restore();if(shadowGap<55){x.fillStyle='#ff3434';x.beginPath();x.arc(r.x-10,sy-20,3,0,7);x.arc(r.x+10,sy-20,3,0,7);x.fill()}}
function drawObjects(){for(const o of objects){let y=projectY(o.z),scale=.25+(y/H)*.85,px=roadX(y,o.lane);x.save();x.translate(px,y);x.scale(scale,scale);x.textAlign='center';x.textBaseline='middle';x.font='36px system-ui';if(o.type==='coin')x.fillText('🪙',0,0);else x.fillText(['🚧','🪨','📦'][o.kind],0,0);x.restore()}}
function update(dt){let f=dt/16.67;distance+=speed*.12*f;const base=[0,6,7.5,9,11][speedChoice],cap=[0,3,12,16,20][speedChoice];speed=Math.min(cap,base+distance/(1400-100*speedChoice));spawn-=speed*f;if(spawn<=0){addObject();if(Math.random()<.28)objects.push({type:'coin',lane:Math.floor(Math.random()*3),z:760});spawn=145-Math.min(70,distance/15)}
if(jump>0||jumpV!==0){jump+=jumpV*f;jumpV-=1.05*f;if(jump<=0){jump=0;jumpV=0}}
for(const o of objects)o.z-=speed*4.7*f;
for(const o of objects){if(o.hit||o.z>95||o.z<20||o.lane!==lane)continue;o.hit=true;if(o.type==='coin'){coinCount++;}else if(jump<45){shadowGap-=38;$('#msg').textContent='Shadow qareeb aa gaya!';setTimeout(()=>{$('#msg').textContent=''},500)}}
objects=objects.filter(o=>o.z>-40&&!o.hit);
shadowGap=Math.min(120,shadowGap+.025*f);
if(distance>=nextWorld&&tunnel<=0){tunnel=90;nextWorld+=650}
if(tunnel>0){tunnel-=f;if(tunnel<=0){world=(world+1)%worlds.length;hud()}}
if(shadowGap<=30){run=false;cancelAnimationFrame(raf);$('#result').textContent='Distance: '+Math.floor(distance)+' m • Coins: '+coinCount;show(over)}hud()}
function draw(){drawWorld();drawObjects();let r=runner();shadow(r);drawTunnel()}
function loop(t){if(!last)last=t;let dt=Math.min(35,t-last);last=t;if(run){update(dt);draw();raf=requestAnimationFrame(loop)}}
let sx=0,sy=0;c.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;c.setPointerCapture(e.pointerId)});c.addEventListener('pointerup',e=>{let dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)>35&&Math.abs(dx)>Math.abs(dy)){lane=Math.max(0,Math.min(2,lane+(dx>0?1:-1)))}else if(jump===0){jumpV=14}});
document.querySelectorAll('.spd').forEach(b=>b.addEventListener('click',()=>{speedChoice=Number(b.dataset.spd);document.querySelectorAll('.spd').forEach(q=>q.classList.remove('green'));b.classList.add('green')}));$('#play').onclick=reset;$('#retry').onclick=reset;$('#menuBtn').onclick=()=>{run=false;cancelAnimationFrame(raf);show(menu)};$('#overMenu').onclick=()=>show(menu);drawWorld();
})();
</script></body></html>
